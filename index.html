    // Guarantees every level from `fromIdx` (4 = level 4) onward is strictly longer than
    // the previous one by appending filler sentences when needed.
    function enforceParagraphGrowth(prompts, filler) {
      for (let i = 3; i < prompts.length; i++) {
        let guard = 0;
        while (prompts[i].length <= prompts[i - 1].length && guard++ < 40) {
          prompts[i] = prompts[i] + " " + filler[guard % filler.length];
        }
      }
    }

    // Builds a paragraph of ~targetWords by rotating through the language's sentences.
    // minChars guarantees the paragraph strictly exceeds the previous level's length,
    // so difficulty (length) always increases. Only reuses existing sentence characters,
    // so keymap coverage is guaranteed.
    function makeParagraph(sentences, targetWords, minChars = 0) {
      const sents = sentences.filter(Boolean).map(s => String(s).trim()).filter(s => s.length > 0);
      if (!sents.length) return "the quick brown fox jumps over the lazy dog";
      const parts = [];
      let total = 0;
      let i = 0;
      while ((total < targetWords || parts.join(" ").length <= minChars) && i < 300) {
        const s = sents[i % sents.length];
        parts.push(s);
        total += s.split(/\s+/).length;
        i++;
      }
      return parts.join(" ");
    }

    function buildLangLevels(lang) {
      let baseLevels;
      let sentences;
      if (LANG_LEVELS_OVERRIDE[lang.code]) {
        baseLevels = [...LANG_LEVELS_OVERRIDE[lang.code]];
        sentences = baseLevels.slice(3);

        return null; // keep the classic English touch-typing drills

        const base = (lang.prompt || "").trim();
        const extras = LANG_EXTRA[lang.code] || [];
        sentences = [base, ...extras].filter(Boolean);
        const chars = [...new Set(base.replace(/\s/g, ""))];
        const chunk = (s, e) => chars.slice(s, e).length ? chars.slice(s, e).join(" ") : chars.slice(0, 15).join(" ");
        baseLevels = [
          chunk(0, 15),
          chunk(15, 30),
          chunk(30, 45),
          base,
          base + " 1 2 3 4 5 6 7 8 9 0",
          extras[0] ? base + " " + extras[0] : base + "  " + base,
          extras[1] ? base + " " + extras[1] : (base + " ").repeat(3).trim(),
          extras[0] ? extras[0] + " " + (extras[1] || extras[0]) : (base + " ").repeat(4).trim(),

          extras[0] ? base + " " + extras[0] + " " + (extras[1] || extras[0]) + " " + base : (base + " ").repeat(6).trim(),

      }
      // Guarantee strict paragraph growth from level 4 onward (levels 1-3 are key drills)
      enforceParagraphGrowth(baseLevels, sentences);
      // Levels 11-40: progressively longer paragraphs in the language's own script,
      // each strictly exceeding the previous (post-enforcement) level's length
      let prevLen = baseLevels[baseLevels.length - 1].length;
      for (let id = 11; id <= 40; id++) {
        const p = makeParagraph(sentences, 14 + Math.round(id * 2.4), prevLen);
        baseLevels.push(p);
        prevLen = p.length;
      }
      return baseLevels;
    }

      enforceParagraphGrowth(list, [lang.prompt || LATIN_SENTENCES[0], ...LATIN_SENTENCES]);

    function getLevelPrompt(lang, levelId) {
      if (lang.levels) return lang.levels[levelId - 1] || lang.prompt;
      const defaultPrompts = getLatinLevels(lang);
      if (levelId <= 10) return defaultPrompts[levelId - 1] || lang.prompt;

    function computeStars(levelId, targetWpm, finalWpm, finalAcc) {
      // Levels 1-20: EXTREMELY EASY in every language — graded bars so any
      // player can unlock and enjoy the first half of the game.
      // L1-10: 3★ = 60% speed/90% acc, 2★ = 30% speed/80% acc
      // L11-20: 3★ = 75% speed/90% acc, 2★ = 45% speed/80% acc
      // Levels 21-40: eased 2★ (60% speed/85% acc) so the whole game
      // progresses smoothly; 3★ keeps the full challenge (100%/95%).
      if (levelId <= 20) {
        const s3 = levelId <= 10 ? 0.6 : 0.75;
        const s2 = levelId <= 10 ? 0.3 : 0.45;
        if (finalWpm >= targetWpm * s3 && finalAcc >= 90) return 3;
        if (finalWpm >= targetWpm * s2 && finalAcc >= 80) return 2;
        return 1;
      }
      if (finalWpm >= targetWpm && finalAcc >= 95) return 3;
      if (finalWpm >= targetWpm * 0.6 && finalAcc >= 85) return 2;
      return 1;
    }

          if (!layer) continue;

      const lower = ch.toLowerCase();
      const nch = stripDiacritics(ch).toLowerCase();
      for (const row of KEYBOARD_ROWS)

        osc.frequency.exponentialRampToValueAtTime(freq * 0.6, now + dur);
        g.gain.setValueAtTime(gain, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(bpf); bpf.connect(g); g.connect(this.ctx.destination);

        if (!this.enabled) return; this.init(); if (!this.ctx) return;

        this._click(900 + Math.random() * 400, 0.025, 0.22);
        const now = this.ctx.currentTime;
        const n = this.ctx.createOscillator(); const ng = this.ctx.createGain();
        n.type = "sawtooth"; n.frequency.setValueAtTime(3000, now);
        ng.gain.setValueAtTime(0.05, now); ng.gain.exponentialRampToValueAtTime(0.001, now + 0.02);
        n.connect(ng); ng.connect(this.ctx.destination);
        n.start(now); n.stop(now + 0.022);
      }
      playVictory() {
        if (!this.enabled) return; this.init(); if (!this.ctx) return;
        [523.25,659.25,783.99,1046.5,1318.5].forEach((freq,i) => {
          const now = this.ctx.currentTime + i * 0.1;
          const osc = this.ctx.createOscillator(); const g = this.ctx.createGain();
          osc.type = "triangle"; osc.frequency.setValueAtTime(freq, now);
          g.gain.setValueAtTime(0.18, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.connect(g); g.connect(this.ctx.destination);
          osc.start(now); osc.stop(now + 0.5);
        });
      }
    }
    const audio = new SoundEngine();

    const textureCache = new Map();

    function createKeycapTexture(text, isActive, theme) {
      const cacheKey = `${text}|${isActive}|${theme.id}`;
      if (textureCache.has(cacheKey)) return textureCache.get(cacheKey);
      const size = 256;
      const c = document.createElement("canvas"); c.width = size; c.height = size;
      const ctx = c.getContext("2d");
      ctx.clearRect(0, 0, size, size);
      const rawLabel = text === "" ? "SPC" : text;
      const label = rawLabel.length > 5 ? rawLabel.substring(0,5) : rawLabel;
      const fontSize = label.length > 3 ? (label.length > 4 ? 40 : 50) : (label.length > 1 ? 64 : 80);

      if (isActive) {
        ctx.shadowColor = theme.accentHex; ctx.shadowBlur = 28;
        ctx.fillStyle = theme.accentHex;
      } else {
        ctx.shadowColor = theme.isLight ? "rgba(20,30,50,0.3)" : theme.accentHex + "44";
        ctx.shadowBlur = theme.isLight ? 4 : 10;
        ctx.fillStyle = theme.textColor;
      }
      const fontStack = `"JetBrains Mono","Noto Sans","Noto Sans Devanagari","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Malayalam","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Gujarati","Noto Sans Gurmukhi","Noto Sans Oriya","Noto Sans Sinhala","Noto Sans Arabic","Noto Sans Hebrew","Noto Sans Greek","Noto Sans Thai","Noto Sans Georgian","Noto Sans Armenian","Noto Sans Ethiopic","Noto Sans Myanmar","Noto Sans Cherokee","Noto Sans Meetei Mayek","Noto Sans Tibetan","Noto Sans Ol Chiki","Noto Sans Thaana","Noto Sans Khmer","Noto Sans Lao",sans-serif`;
      ctx.font = `800 ${fontSize}px ${fontStack}`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(label, size/2, size/2);
      ctx.shadowBlur = 0;
      ctx.fillStyle = isActive ? "#ffffff" : theme.textColor;
      ctx.font = `800 ${fontSize}px ${fontStack}`;
      ctx.fillText(label, size/2, size/2);
      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      textureCache.set(cacheKey, tex);
      return tex;
    }

    /* ═══════════════════════════════════════════════════════════════
       3D MECHANICAL KEYBOARD CANVAS
    ═══════════════════════════════════════════════════════════════ */
    function Keyboard3DCanvas({ pressedKeysRef, activeTargetKeyRef, cameraPreset, langCode, keyboardMap, theme, activeModifier }) {
      const containerRef = useRef(null);
      const stateRef = useRef({ pressedKeys: new Set(), activeTargetKey: null });

      useEffect(() => { stateRef.current.pressedKeys = pressedKeysRef.current; });
      useEffect(() => { stateRef.current.activeTargetKey = activeTargetKeyRef.current; });

      const resolvedMap = useMemo(() => resolveActiveKeymap(keyboardMap, activeModifier), [keyboardMap, activeModifier]);

      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;
        const W = container.clientWidth, H = container.clientHeight;

        const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:"high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
        renderer.setSize(W, H);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(42, W/H, 0.1, 200);
        camera.position.set(0, 8, 11);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false; controls.enablePan = false;
        controls.maxPolarAngle = Math.PI/2.4; controls.minPolarAngle = Math.PI/7;
        controls.rotateSpeed = 0.5; controls.dampingFactor = 0.08; controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0x1a1a3a, theme.isLight ? 2.2 : 1.8));
        const sun = new THREE.DirectionalLight(0xffffff, theme.isLight ? 2.4 : 1.5);
        sun.position.set(8,16,8); sun.castShadow = true;
        sun.shadow.mapSize.set(1024,1024); sun.shadow.bias = -0.001;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(theme.accentInt, 0.4);
        fill.position.set(-8,4,10); scene.add(fill);
        const rgbLight = new THREE.PointLight(theme.accentInt, 3.5, 30);
        rgbLight.position.set(0,7,0); scene.add(rgbLight);
        const keySpotlight = new THREE.PointLight(theme.accentInt, 0, 8);
        keySpotlight.position.set(0,4,0); scene.add(keySpotlight);

        const floorMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(50,50),
          new THREE.MeshStandardMaterial({ color:0x04060f, roughness:0.9, metalness:0.05 })
        );
        floorMesh.rotation.x = -Math.PI/2; floorMesh.position.y = -0.85;
        floorMesh.receiveShadow = true; scene.add(floorMesh);

        let maxRowWidth = 0;
        KEYBOARD_ROWS.forEach(row => {
          let w = row.stagger * KEY_UNIT;
          row.keys.forEach(k => { w += k.w * KEY_UNIT + KEY_GAP; });
          if (w > maxRowWidth) maxRowWidth = w;
        });
        const chassisW = maxRowWidth + 0.4;
        const chassisD = KEYBOARD_ROWS.length * (KEY_H + KEY_GAP) + 0.4;

        const chassis = new THREE.Mesh(
          new THREE.BoxGeometry(chassisW, 0.55, chassisD),
          new THREE.MeshStandardMaterial({ color: theme.chassis, roughness:0.2, metalness: theme.isLight ? 0.45 : 0.9 })
        );
        chassis.position.set(0,-0.42,0); chassis.receiveShadow = true; scene.add(chassis);

        const edgeStripMat = new THREE.MeshStandardMaterial({
          color: theme.accentInt, emissive: theme.accentInt, emissiveIntensity:1.4, roughness:0.1, metalness:0.8
        });
        const edgeStrip = new THREE.Mesh(new THREE.BoxGeometry(chassisW+0.06,0.04,chassisD+0.06), edgeStripMat);
        edgeStrip.position.set(0,-0.15,0); scene.add(edgeStrip);

        const keyMeshes = new Map();
        const centerOffsetX = -maxRowWidth / 2;
        const startZ = -(chassisD/2)+0.5;

        KEYBOARD_ROWS.forEach((row, rIdx) => {
          const rowZ = startZ + rIdx * (KEY_H + KEY_GAP);
          let curX = centerOffsetX + row.stagger * KEY_UNIT;

          row.keys.forEach(key => {
            const kw = key.w * KEY_UNIT - KEY_GAP * 0.5;
            const kh = KEY_H - KEY_GAP * 0.5;
            const group = new THREE.Group();
            const posX = curX + kw/2;
            group.position.set(posX, 0, rowZ);

            const fc = parseInt(FINGER_COLORS[key.finger].hex.replace("#",""), 16);

            const bodyMat = new THREE.MeshStandardMaterial({
              color: theme.keyBody,
              roughness: theme.isLight ? 0.22 : 0.18,
              metalness: theme.isLight ? 0.35 : 0.85,
              emissive:0x000000, emissiveIntensity:0,
            });
            const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(kw,0.46,kh), bodyMat);
            bodyMesh.castShadow = true; bodyMesh.receiveShadow = true; group.add(bodyMesh);

            const shoulderMesh = new THREE.Mesh(
              new THREE.BoxGeometry(kw*0.94, 0.42, kh*0.94),
              new THREE.MeshStandardMaterial({ color: theme.keyBody, roughness:0.15, metalness: theme.isLight ? 0.3 : 0.88 })
            );
            shoulderMesh.position.y = 0.05; group.add(shoulderMesh);

            const topMesh = new THREE.Mesh(
              new THREE.BoxGeometry(kw-0.08, 0.05, kh-0.08),
              new THREE.MeshStandardMaterial({ color: theme.keyTop, roughness:0.12, metalness: theme.isLight ? 0.38 : 0.92 })
            );
            topMesh.position.y = 0.25; group.add(topMesh);

            const rimMesh = new THREE.Mesh(
              new THREE.BoxGeometry(kw-0.02, 0.02, kh-0.02),
              new THREE.MeshStandardMaterial({ color:fc, emissive:fc, emissiveIntensity:0.35, roughness:0.1, metalness:0.7 })
            );
            rimMesh.position.y = 0.24; group.add(rimMesh);

            const displayChar = resolvedMap ? (resolvedMap[key.code] || key.char) : key.char;
            const labelText = displayChar === "" ? "SPC" : displayChar;
            const labelW = Math.min(kw-0.14, 0.9);
            const labelH = Math.min(kh-0.14, 0.9);
            const labelMat = new THREE.MeshBasicMaterial({
              map: createKeycapTexture(labelText, false, theme),
              transparent:true, depthWrite:false, side:THREE.FrontSide,
            });
            const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(labelW, labelH), labelMat);
            labelMesh.rotation.x = -Math.PI/2;
            labelMesh.position.set(0, 0.285, 0);
            group.add(labelMesh);

            scene.add(group);
            keyMeshes.set(key.code, { group, bodyMesh, labelMesh, labelMat, displayChar, posX, posZ:rowZ });
            curX += kw + KEY_GAP;
          });
        });

        const pCount = 80;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(pCount*3);
        for (let i=0; i<pCount; i++) {
          pPos[i*3]   = (Math.random()-0.5)*chassisW*1.2;
          pPos[i*3+1] = Math.random()*5+1.5;
          pPos[i*3+2] = (Math.random()-0.5)*chassisD*1.2;
        }
        pGeo.setAttribute("position", new THREE.BufferAttribute(pPos,3));
        const pMat = new THREE.PointsMaterial({ color: theme.accentInt, size:0.06, transparent:true, opacity:0.5, sizeAttenuation:true });
        scene.add(new THREE.Points(pGeo, pMat));

        const keyStateY = new Map();
        const clock = new THREE.Clock();
        let raf;

        const CAM_PRESETS = {
          isometric: new THREE.Vector3(0,8,11),
          fps:       new THREE.Vector3(0,4.5,8),
          top:       new THREE.Vector3(0,14,0.5),
        };

        function animate() {
          raf = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          rgbLight.intensity = 2.5 + Math.sin(t*1.2)*0.5;
          edgeStripMat.emissiveIntensity = 0.9 + Math.sin(t*1.5)*0.3;

          const pos = pGeo.attributes.position.array;
          for (let i=0; i<pCount; i++) pos[i*3+1] += Math.sin(t*0.6+i*0.7)*0.003;
          pGeo.attributes.position.needsUpdate = true;
          pMat.opacity = 0.3 + Math.sin(t*0.5)*0.15;

          const cp = cameraPreset || "isometric";
          camera.position.lerp(CAM_PRESETS[cp] || CAM_PRESETS.isometric, 0.04);

          const pressed = stateRef.current.pressedKeys;
          const active  = stateRef.current.activeTargetKey;

          keyMeshes.forEach((item, code) => {
            const isPressed = pressed && pressed.has(code);
            const isActive  = active && active.code === code;

            const targetY = isPressed ? -0.18 : 0;
            const currY = keyStateY.get(code) || 0;
            const newY  = currY + (targetY - currY) * 0.28;
            keyStateY.set(code, newY);
            item.group.position.y = newY;

            if (isPressed) {
              item.bodyMesh.material.color.setHex(0x1a0030);
              item.bodyMesh.material.emissive.setHex(theme.accentInt);
              item.bodyMesh.material.emissiveIntensity = 2.8;
              item.bodyMesh.material.roughness = 0.08;
              item.labelMat.map = createKeycapTexture(item.displayChar || "SPC", true, theme);
              item.labelMat.needsUpdate = true;
              keySpotlight.color.setHex(theme.accentInt);
              keySpotlight.intensity = 5.0;
              keySpotlight.position.set(item.posX, 4, item.posZ);
            } else if (isActive) {
              const pulse = 0.7 + Math.sin(t*5)*0.3;
              item.bodyMesh.material.color.setHex(theme.isLight ? 0xe2e8f0 : 0x001a33);
              item.bodyMesh.material.emissive.setHex(theme.accentInt);
              item.bodyMesh.material.emissiveIntensity = 1.8*pulse;
              item.bodyMesh.material.roughness = 0.10;
              item.labelMat.map = createKeycapTexture(item.displayChar || "SPC", true, theme);
              item.labelMat.needsUpdate = true;
              keySpotlight.color.setHex(theme.accentInt);
              keySpotlight.intensity = 3.5*pulse;
              keySpotlight.position.set(item.posX, 3.5, item.posZ);
            } else {
              item.bodyMesh.material.color.setHex(theme.keyBody);
              item.bodyMesh.material.emissive.setHex(0x000000);
              item.bodyMesh.material.emissiveIntensity = 0;
              item.bodyMesh.material.roughness = theme.isLight ? 0.22 : 0.18;
            }
          });

          controls.update();
          renderer.render(scene, camera);
        }
        animate();

        const handleResize = () => {
          const w=container.clientWidth, h=container.clientHeight;
          camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h);
        };
        window.addEventListener("resize", handleResize);
        return () => {
          window.removeEventListener("resize", handleResize);
          cancelAnimationFrame(raf);
          controls.dispose(); renderer.dispose();
          if (container.contains(renderer.domElement)) container.removeChild(renderer.domElement);
        };
      }, [cameraPreset, langCode, theme, resolvedMap]);

      return <div ref={containerRef} style={{ width:"100%", height:"100%" }} />;
    }

                    </div>

                    {isLocked && (
                      <div style={{ fontSize:"8px", color:"#fb923c", fontFamily:"'Orbitron',sans-serif", fontWeight:700, letterSpacing:"0.08em", marginTop:"4px" }}>🔒 EARN 2★ TO UNLOCK</div>
                    )}

                    <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:"8px" }}>
                      <span style={{ fontSize:"9px", color:"#ffd700", fontFamily:"'Orbitron',sans-serif", fontWeight:700 }}>
                        + {lvl.xpReward} XP
                      </span>
                      <span style={{ fontSize:"9px", color:"#a855f7", fontFamily:"'Orbitron',sans-serif", fontWeight:700 }}>
                        {lvl.difficulty.toUpperCase()}
                      </span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════
       FINGER HUD
    ═══════════════════════════════════════════════════════════════ */
    function FingerHUD({ activeTargetKey }) {
      const af = activeTargetKey?.finger;
      const ah = activeTargetKey?.hand;
      const leftF  = [{f:"pinky",name:"Pinky",keys:"Q A Z"},{f:"ring",name:"Ring",keys:"W S X"},{f:"middle",name:"Middle",keys:"E D C"},{f:"index",name:"Index",keys:"R F V"}];
      const rightF = [{f:"index",name:"Index",keys:"Y H N"},{f:"middle",name:"Middle",keys:"I K ,"},{f:"ring",name:"Ring",keys:"O L ."},{f:"pinky",name:"Pinky",keys:"P ; '"}];
      const renderF = (item, hand) => {
        const isActive = ah === hand && af === item.f;
        const fc = FINGER_COLORS[item.f];
        return (
          <div key={`${hand}-${item.f}`} className="finger-badge" style={{ background:isActive?`${fc.hex}18`:"rgba(0,0,0,0.3)", borderColor:isActive?`${fc.hex}55`:"rgba(255,255,255,0.06)", boxShadow:isActive?`0 0 14px ${fc.glow}`:"none", transform:isActive?"scale(1.04)":"scale(1)" }}>
            <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between" }}>
              <div style={{ display:"flex",alignItems:"center",gap:"8px" }}>
                <span style={{ width:"8px",height:"8px",borderRadius:"50%",background:fc.hex,boxShadow:isActive?`0 0 8px ${fc.hex}`:"none",display:"inline-block" }} />
                <span style={{ fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:"12px",color:isActive?fc.hex:"#94a3b8",textShadow:isActive?`0 0 8px ${fc.hex}`:"none" }}>{item.name}</span>
              </div>
              <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"9px",color:"#475569" }}>{item.keys}</span>
            </div>
          </div>
        );
      };
      return (
        <div className="glass" style={{ borderRadius:"16px",padding:"14px",display:"flex",flexDirection:"column",gap:"10px" }}>
          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between" }}>
            <span style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"9px",fontWeight:700,letterSpacing:"0.1em",color:"#64748b",textTransform:"uppercase" }}>🖐 Finger Map</span>
            {activeTargetKey && (
              <div className="key-target-pill" style={{ background:`${FINGER_COLORS[af].hex}18`,border:`1px solid ${FINGER_COLORS[af].hex}44`,color:FINGER_COLORS[af].hex,textShadow:`0 0 8px ${FINGER_COLORS[af].hex}` }}>
                <span style={{ width:"6px",height:"6px",borderRadius:"50%",background:FINGER_COLORS[af].hex,display:"inline-block" }} />
                {ah?.toUpperCase()} {af?.toUpperCase()}
              </div>
            )}
          </div>
          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px" }}>
            <div>
              <div style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"9px",fontWeight:700,color:ah==="left"?"#00f5ff":"#334155",textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:"6px",textShadow:ah==="left"?"0 0 8px #00f5ff80":"none" }}>◀ Left</div>
              <div style={{ display:"flex",flexDirection:"column",gap:"4px" }}>{leftF.map(it=>renderF(it,"left"))}</div>
            </div>
            <div>
              <div style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"9px",fontWeight:700,color:ah==="right"?"#00f5ff":"#334155",textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:"6px",textShadow:ah==="right"?"0 0 8px #00f5ff80":"none" }}>Right ▶</div>
              <div style={{ display:"flex",flexDirection:"column",gap:"4px" }}>{rightF.map(it=>renderF(it,"right"))}</div>
            </div>
          </div>
          <div className="finger-badge" style={{ background:af==="thumb"?"rgba(14,165,233,0.12)":"rgba(0,0,0,0.3)", borderColor:af==="thumb"?"rgba(14,165,233,0.4)":"rgba(255,255,255,0.06)", boxShadow:af==="thumb"?"0 0 14px rgba(14,165,233,0.4)":"none" }}>
            <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between" }}>
              <div style={{ display:"flex",alignItems:"center",gap:"8px" }}>
                <span style={{ width:"8px",height:"8px",borderRadius:"50%",background:"#0ea5e9",display:"inline-block" }} />
                <span style={{ fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:"12px",color:af==="thumb"?"#0ea5e9":"#94a3b8" }}>Both Thumbs</span>
              </div>
              <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"9px",color:af==="thumb"?"#0ea5e9":"#475569",padding:"2px 8px",borderRadius:"10px",background:af==="thumb"?"rgba(14,165,233,0.15)":"transparent",border:af==="thumb"?"1px solid rgba(14,165,233,0.3)":"1px solid transparent" }}>SPACEBAR</span>
            </div>
          </div>
        </div>
      );
    }

    function MetricCard({ label, value, unit, color }) {
      return (
        <div className="metric-card">
          <div style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"9px",fontWeight:600,letterSpacing:"0.12em",color:"#475569",textTransform:"uppercase",marginBottom:"6px" }}>{label}</div>
          <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"24px",fontWeight:800,color,textShadow:`0 0 14px ${color}99`,lineHeight:1 }}>
            {value}<span style={{ fontSize:"11px",fontWeight:600,marginLeft:"3px",opacity:0.7 }}>{unit}</span>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════════════════════════
       MAIN APP COMPONENT
    ═══════════════════════════════════════════════════════════════ */
    function App() {
      const [activeLang, setActiveLang]       = useState(DEFAULT_LANG);
      const [showLangModal, setShowLangModal] = useState(false);
      const [showLevelModal, setShowLevelModal] = useState(false);
      const [currentTheme, setCurrentTheme]   = useState(COLOR_THEMES[0]);
      const [activeModifier, setActiveModifier] = useState("unshifted");
      const [activeLevel, setActiveLevel]     = useState(LEVELS[0]);
      const [unlockedLevel, setUnlockedLevel] = useState(1);

      // Start Test Flow State: "idle" | "running" | "completed"
      const [testState, setTestState]         = useState("idle");

      const [typedInput, setTypedInput]       = useState("");
      const [pressedKeys, setPressedKeys]     = useState(new Set());
      const [startTime, setStartTime]         = useState(null);
      const [elapsed, setElapsed]             = useState(0);
      const [totalKS, setTotalKS]             = useState(0);
      const [errorCount, setErrorCount]       = useState(0);
      const [streak, setStreak]               = useState(0);
      const [xp, setXp]                       = useState(680);
      const [audioEnabled, setAudioEnabled]   = useState(true);
      const [cameraPreset, setCameraPreset]   = useState("isometric");
      const [earnedStars, setEarnedStars]     = useState(0);

      const pressedKeysRef  = useRef(pressedKeys);
      const activeTargetRef = useRef(null);

      const promptText = useMemo(() => getLevelPrompt(activeLang, activeLevel.id), [activeLang, activeLevel]);
      const keyboardMap = activeLang.keyMap;
      const targetChar = promptText[typedInput.length] || "";
      const activeTargetKey = useMemo(() => getKeyConfigForChar(targetChar, keyboardMap, activeModifier), [targetChar, keyboardMap, activeModifier]);
      const targetLayer = findCharLayer(targetChar, keyboardMap);

      useEffect(() => { pressedKeysRef.current = pressedKeys; }, [pressedKeys]);
      useEffect(() => { activeTargetRef.current = activeTargetKey; }, [activeTargetKey]);

      // Reset on language, level, or theme change
      useEffect(() => {
        setTypedInput(""); setStartTime(null); setElapsed(0);
        setTotalKS(0); setErrorCount(0); setStreak(0); setTestState("idle");
        setEarnedStars(0);
        textureCache.clear();
      }, [activeLang, activeLevel, currentTheme]);

      // Timer
      useEffect(() => {
        let t;
        if (testState === "running" && startTime) {
          t = setInterval(() => setElapsed(Math.floor((Date.now()-startTime)/1000)), 1000);
        }
        return () => clearInterval(t);
      }, [startTime, testState]);

      const wpm = useMemo(() => {
        if (!startTime || elapsed === 0) return 0;
        return Math.round((typedInput.length/5)/(elapsed/60));
      }, [typedInput.length, elapsed, startTime]);

      const accuracy = useMemo(() => {
        if (totalKS === 0) return 100;
        return Math.max(0, Math.round(((totalKS-errorCount)/totalKS)*100));
      }, [totalKS, errorCount]);

      const progress = Math.round((typedInput.length/promptText.length)*100);

      const handleStartTest = () => {
        setTypedInput("");
        setStartTime(Date.now());
        setElapsed(0);
        setTotalKS(0);
        setErrorCount(0);
        setStreak(0);
        setEarnedStars(0);
        setTestState("running");
      };

      const handleReset = () => {
        setTypedInput(""); setStartTime(null); setElapsed(0);
        setTotalKS(0); setErrorCount(0); setStreak(0); setEarnedStars(0); setTestState("idle");
      };

      const handleKeyPress = useCallback((key, code, modifier, event) => {
        if (testState !== "running") {
          if (key === "Enter" || key === " ") {
            handleStartTest();
          }
          return;
        }

        setPressedKeys(prev => new Set(prev).add(code));

        if (key === "Backspace") {
          setTypedInput(prev => prev.slice(0,-1));
          audio.playKeyPress(false); return;
        }
        if (key.length > 1 && key !== " ") return;

        // Determine active layer map (modifier passed synchronously from the event)
        const activeLayerMap = resolveActiveKeymap(keyboardMap, modifier);
        const effectiveChar = activeLayerMap ? (activeLayerMap[code] || key) : key;
        const tc = promptText[typedInput.length];
        setTotalKS(prev => prev+1);

        // Latin scripts: accept base-letter matches so é/ñ/ü type on any layout
        const isLatin = !keyboardMap;
        const matches =
          effectiveChar === tc ||
          (tc === " " && (key === " " || effectiveChar === " ")) ||
          (isLatin && tc && effectiveChar && stripDiacritics(effectiveChar) === stripDiacritics(tc));

        if (matches) {
          const ni = typedInput + effectiveChar;
          setTypedInput(ni); setStreak(prev=>prev+1); setXp(prev=>prev+10);
          audio.playKeyPress(false);

          if (ni.length === promptText.length) {
            // Compute final stats + stars on the final keystroke (closure holds pre-final totals)
            const secs = (Date.now() - startTime) / 1000;
            const finalWpm = secs > 0 ? Math.round((ni.length / 5) / (secs / 60)) : 0;
            const finalKs = totalKS + 1;
            const finalAcc = finalKs > 0 ? Math.max(0, Math.round(((finalKs - errorCount) / finalKs) * 100)) : 100;
            let stars = computeStars(activeLevel.id, activeLevel.targetWpm, finalWpm, finalAcc);
            setEarnedStars(stars);
            setTestState("completed");
            audio.playVictory();
            setXp(prev=>prev+activeLevel.xpReward);
            // Levels unlock only when the player earns 2 or more stars
            if (stars >= 2 && activeLevel.id >= unlockedLevel) {
              setUnlockedLevel(Math.min(LEVELS.length, activeLevel.id + 1));
            }
          }
        } else {
          setErrorCount(prev=>prev+1); setStreak(0); audio.playKeyPress(true);
        }
      }, [testState, typedInput, promptText, keyboardMap, activeLevel, unlockedLevel]);

      useEffect(() => {
        const kd = (e) => {
          if (e.code === "Space" || e.code === "Tab") e.preventDefault();

          const isShift = e.shiftKey || e.code === "ShiftLeft" || e.code === "ShiftRight";
          const isAltGr = e.altKey || e.code === "AltRight";

          const mod = (isAltGr && isShift) ? "altGrShift" : isAltGr ? "altGr" : isShift ? "shifted" : "unshifted";
          setActiveModifier(mod);

          handleKeyPress(e.key, e.code, mod, e);
        };

        const ku = (e) => {
          setPressedKeys(prev => { const n=new Set(prev); n.delete(e.code); return n; });

          const isShift = e.shiftKey;
          const isAltGr = e.altKey;

          if (isAltGr && isShift) setActiveModifier("altGrShift");
          else if (isAltGr) setActiveModifier("altGr");
          else if (isShift) setActiveModifier("shifted");
          else setActiveModifier("unshifted");
        };

        window.addEventListener("keydown", kd);
        window.addEventListener("keyup", ku);
        return () => { window.removeEventListener("keydown",kd); window.removeEventListener("keyup",ku); };
      }, [handleKeyPress]);

      const xpPct = Math.min(100, Math.round((xp%1000)/1000*100));
      const sc = SCRIPT_COLORS[activeLang.script] || "#64748b";

      // Unlock status for the current level (2★ gate)
      const nextUnlocked = activeLevel.id < LEVELS.length && activeLevel.id + 1 <= unlockedLevel;

      return (
        <div className="app-wrapper">
          {showLangModal && (
            <LanguageSelectorModal
              activeLang={activeLang}
              onSelect={setActiveLang}
              onClose={() => setShowLangModal(false)}
            />
          )}

          {showLevelModal && (
            <LevelSelectorModal
              activeLevel={activeLevel}
              unlockedLevel={unlockedLevel}
              onSelectLevel={setActiveLevel}
              onClose={() => setShowLevelModal(false)}
            />
          )}

          {/* LEVEL COMPLETE CELEBRATION MODAL */}
          {testState === "completed" && (
            <div className="modal-overlay">
              <div className="glass" style={{ borderRadius:"24px",padding:"32px",maxWidth:"520px",width:"100%",textAlign:"center",borderColor:"#ffd700",boxShadow:"0 0 60px rgba(255,215,0,0.4)" }}>
                <div style={{ fontSize:"54px",marginBottom:"8px" }}>🏆</div>
                <h2 style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"20px",fontWeight:800,color:"#ffd700",letterSpacing:"0.08em" }}>LEVEL COMPLETE!</h2>
                <div style={{ fontFamily:"'Rajdhani',sans-serif",fontSize:"14px",color:"#94a3b8",marginTop:"2px" }}>{activeLevel.name}</div>

                {/* Stars */}
                <div style={{ fontSize:"36px",margin:"14px 0 4px" }}>
                  {"⭐".repeat(earnedStars)}{"☆".repeat(3 - earnedStars)}
                </div>
                <div style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"9px",letterSpacing:"0.1em",marginTop:"2px",color: earnedStars >= 2 ? "#00ff88" : "#fb923c",textShadow: earnedStars >= 2 ? "0 0 10px rgba(0,255,136,0.5)" : "none" }}>
                  {activeLevel.id < LEVELS.length
                    ? (earnedStars >= 2 ? `⭐ LEVEL ${activeLevel.id + 1} UNLOCKED!` : "EARN 2★ TO UNLOCK THE NEXT LEVEL")
                    : "ALL 40 LEVELS MASTERED — LEGENDARY!"}
                </div>
                <div style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"8px",letterSpacing:"0.12em",marginTop:"8px",color:"#475569" }}>
                  💡 TIP: <span style={{ color:"#ffd700" }}>2★</span> IS ALL YOU NEED TO UNLOCK THE NEXT LEVEL
                </div>

                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"10px",margin:"16px 0" }}>
                  <div className="metric-card" style={{ textAlign:"center" }}>
                    <div style={{ fontSize:"8px",fontFamily:"'Orbitron',sans-serif",color:"#64748b" }}>SPEED</div>
                    <div style={{ fontSize:"20px",fontFamily:"'JetBrains Mono',monospace",color:"#00f5ff",fontWeight:800 }}>{wpm}<span style={{ fontSize:"9px" }}>WPM</span></div>
                  </div>
                  <div className="metric-card" style={{ textAlign:"center" }}>
                    <div style={{ fontSize:"8px",fontFamily:"'Orbitron',sans-serif",color:"#64748b" }}>ACCURACY</div>
                    <div style={{ fontSize:"20px",fontFamily:"'JetBrains Mono',monospace",color:"#00ff88",fontWeight:800 }}>{accuracy}<span style={{ fontSize:"9px" }}>%</span></div>
                  </div>
                  <div className="metric-card" style={{ textAlign:"center" }}>
                    <div style={{ fontSize:"8px",fontFamily:"'Orbitron',sans-serif",color:"#64748b" }}>REWARD</div>
                    <div style={{ fontSize:"20px",fontFamily:"'JetBrains Mono',monospace",color:"#ffd700",fontWeight:800 }}>+{activeLevel.xpReward}<span style={{ fontSize:"9px" }}>XP</span></div>
                  </div>
                </div>

                <div style={{ display:"flex",gap:"10px",justifyContent:"center",marginTop:"20px" }}>
                  <button className="btn-cyber" onClick={handleStartTest} style={{ padding:"10px 20px" }}>↺ RETRY</button>
                  {activeLevel.id < LEVELS.length ? (
                    nextUnlocked ? (
                      <button className="btn-start-test" onClick={() => {
                        const nextLvl = LEVELS.find(l => l.id === activeLevel.id + 1);
                        if (nextLvl) { setActiveLevel(nextLvl); setTestState("idle"); }
                      }} style={{ padding:"10px 24px",fontSize:"12px" }}>
                        NEXT LEVEL ▶
                      </button>
                    ) : (
                      <button className="btn-cyber" disabled style={{ padding:"10px 20px",opacity:0.55,cursor:"not-allowed",borderColor:"rgba(251,146,60,0.4)",color:"#fb923c" }}>🔒 EARN 2★ ▶</button>
                    )
                  ) : null}
                </div>
              </div>
            </div>
          )}

          {/* ── HEADER ── */}
          <header className="glass" style={{ borderRadius:"16px",padding:"12px 20px",display:"flex",flexWrap:"wrap",alignItems:"center",justifyContent:"space-between",gap:"10px" }}>
            <div style={{ display:"flex",alignItems:"center",gap:"12px" }}>
              <div style={{ width:"40px",height:"40px",borderRadius:"12px",background:`linear-gradient(135deg, ${currentTheme.accentHex}33, rgba(155,48,255,0.15))`,border:`1px solid ${currentTheme.accentHex}66`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"20px",boxShadow:`0 0 18px ${currentTheme.accentHex}44` }}>⌨️</div>
              <div>
                <h1 style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"13px",fontWeight:800,letterSpacing:"0.08em",background:`linear-gradient(90deg,${currentTheme.accentHex},#ff00e5)`,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",backgroundClip:"text",margin:0 }}>3D TOUCH TYPING MASTER</h1>
                <p style={{ fontSize:"9px",color:"#475569",fontFamily:"'Orbitron',sans-serif",letterSpacing:"0.1em",marginTop:"2px" }}>CYBERPUNK · 40 LEVELS · 100+ LANGUAGES</p>
              </div>
            </div>

            {/* LEVEL SELECTOR BADGE */}
            <button className="btn-lang" onClick={() => setShowLevelModal(true)} style={{ borderColor:"rgba(255,215,0,0.4)",background:"linear-gradient(135deg,rgba(255,215,0,0.15),rgba(155,48,255,0.12))" }}>
              <span style={{ fontSize:"16px" }}>🎯</span>
              <span style={{ color:"#ffd700" }}>{activeLevel.name.split(":")[0]}</span>
              <span style={{ fontSize:"8px",padding:"1px 5px",borderRadius:"4px",background:"rgba(255,215,0,0.2)",color:"#ffd700" }}>{activeLevel.difficulty}</span>
              <span style={{ fontSize:"9px",color:"#ffd700" }}>▼</span>
            </button>

            {/* 10 COLOR THEME SELECTOR */}
            <div style={{ display:"flex",alignItems:"center",gap:"5px",background:"rgba(0,0,0,0.4)",padding:"5px 10px",borderRadius:"12px",border:"1px solid rgba(255,255,255,0.08)" }}>
              <span style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"8px",fontWeight:700,color:"#94a3b8",marginRight:"4px" }}>THEMES:</span>
              {COLOR_THEMES.map(th => (
                <button
                  key={th.id}
                  className={`theme-swatch-btn ${currentTheme.id === th.id ? "active" : ""}`}
                  style={{ background: th.swatch }}
                  onClick={() => setCurrentTheme(th)}
                  title={th.name}
                >
                  {th.icon}
                </button>
              ))}
            </div>

            <div style={{ display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap" }}>
              {/* Active Language Badge */}
              <button className="btn-lang" onClick={() => setShowLangModal(true)}>
                <span style={{ fontSize:"16px" }}>{activeLang.flag}</span>
                <span>{activeLang.name}</span>
                <span style={{ fontSize:"8px",padding:"1px 5px",borderRadius:"4px",background:`${sc}22`,border:`1px solid ${sc}44`,color:sc }}>{activeLang.script}</span>
                <span style={{ fontSize:"9px",color:"#c084fc" }}>▼</span>
              </button>

              {/* XP */}
              <div style={{ display:"flex",flexDirection:"column",alignItems:"flex-end",gap:"3px" }}>
                <span style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"10px",color:"#ffd700",textShadow:"0 0 10px #ffd70080",fontWeight:700 }}>⚡ {xp} XP</span>
                <div className="xp-bar-track" style={{ width:"70px" }}><div className="xp-bar-fill" style={{ width:`${xpPct}%` }} /></div>
              </div>

              {/* Audio */}
              <button className="btn-cyber" onClick={() => { setAudioEnabled(v=>!v); audio.enabled=!audioEnabled; }} style={{ borderColor:audioEnabled?`${currentTheme.accentHex}66`:"rgba(255,70,100,0.4)",color:audioEnabled?currentTheme.accentHex:"#ff4466" }}>
                {audioEnabled?"🔊":"🔇"}
              </button>

              {/* Camera */}
              <div style={{ display:"flex",gap:"3px",background:"rgba(0,0,0,0.4)",padding:"3px",borderRadius:"9px",border:"1px solid rgba(255,255,255,0.06)" }}>
                {["isometric","fps","top"].map(m => (
                  <button key={m} className={`btn-cyber ${cameraPreset===m?"active":""}`} onClick={() => setCameraPreset(m)} style={{ padding:"3px 8px",fontSize:"9px" }}>{m.toUpperCase()}</button>
                ))}
              </div>

              <button className="btn-cyber" onClick={handleReset} style={{ borderColor:"rgba(255,0,229,0.3)",color:"#ff00e5" }}>↺</button>
            </div>
          </header>

          {/* ── MAIN ── */}
          <main className="main-grid" style={{ flex:1 }}>

            {/* LEFT SIDEBAR */}
            <div className="sidebar">

              {/* Metrics */}
              <div className="glass-cyan" style={{ borderRadius:"16px",padding:"14px",borderColor:`${currentTheme.accentHex}33` }}>
                <div style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"9px",fontWeight:700,letterSpacing:"0.12em",color:`${currentTheme.accentHex}aa`,textTransform:"uppercase",marginBottom:"10px" }}>Live Metrics</div>
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px" }}>
                  <MetricCard label="Speed"    value={wpm}      unit="WPM" color={currentTheme.accentHex} />
                  <MetricCard label="Accuracy" value={accuracy} unit="%"   color="#00ff88" />
                  <MetricCard label="Streak"   value={streak}   unit="x"   color="#ffd700" />
                  <MetricCard label="Time"     value={elapsed}  unit="s"   color="#a855f7" />
                </div>
                <div style={{ marginTop:"12px" }}>
                  <div style={{ display:"flex",justifyContent:"space-between",marginBottom:"4px" }}>
                    <span style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"8px",color:"#475569",letterSpacing:"0.1em" }}>PROGRESS</span>
                    <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:"10px",color:currentTheme.accentHex,fontWeight:700 }}>{progress}%</span>
                  </div>
                  <div style={{ height:"4px",background:"rgba(255,255,255,0.06)",borderRadius:"2px",overflow:"hidden" }}>
                    <div style={{ height:"100%",width:`${progress}%`,background:`linear-gradient(90deg,${currentTheme.accentHex},#9b30ff)`,borderRadius:"2px",transition:"width 0.35s ease",boxShadow:`0 0 10px ${currentTheme.accentHex}88` }} />
                  </div>
                </div>
              </div>

              {/* Active Level Badge */}
              <div className="glass" style={{ borderRadius:"14px",padding:"12px 14px",borderColor:"rgba(255,215,0,0.3)",cursor:"pointer" }} onClick={() => setShowLevelModal(true)}>
                <div style={{ display:"flex",alignItems:"center",gap:"10px" }}>
                  <div style={{ fontSize:"26px" }}>🎯</div>
                  <div>
                    <div style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"8px",color:"#ffd700",letterSpacing:"0.1em" }}>ACTIVE LEVEL</div>
                    <div style={{ fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:"14px",color:"#ffffff" }}>{activeLevel.name}</div>
                    <div style={{ fontSize:"10px",color:"#94a3b8",marginTop:"1px" }}>Target: {activeLevel.targetWpm} WPM · {activeLevel.difficulty}</div>
                  </div>
                </div>
                <div style={{ textAlign:"center",marginTop:"8px",fontFamily:"'Orbitron',sans-serif",fontSize:"8px",color:"rgba(255,215,0,0.7)",letterSpacing:"0.1em" }}>SELECT LEVEL (1-40) ▼</div>
              </div>

              {/* 4-Layer Modifier State Card */}
              <div className="glass" style={{ borderRadius:"14px",padding:"12px 14px",borderColor:`${currentTheme.accentHex}44` }}>
                <div style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"8px",color:"#64748b",letterSpacing:"0.1em",marginBottom:"6px" }}>MODIFIER KEYMAP LAYER</div>
                <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:"5px" }}>
                  {[
                    { id:"unshifted", label:"[Unshifted]" },
                    { id:"shifted",   label:"[Shifted]" },
                    { id:"altGr",     label:"[AltRight (AltGr)]" },
                    { id:"altGrShift",label:"[AltGr + Shift]" },
                  ].map(layer => (
                    <button
                      key={layer.id}
                      className={`btn-layer ${activeModifier === layer.id ? "active" : ""}`}
                      onClick={() => setActiveModifier(layer.id)}
                    >
                      {layer.label}
                    </button>
                  ))}
                </div>
              </div>

              {/* Next key callout */}
              {activeTargetKey && testState === "running" && (
                <div className="glass" style={{ borderRadius:"14px",padding:"12px 14px",borderColor:`${FINGER_COLORS[activeTargetKey.finger].hex}44`,boxShadow:`0 0 20px ${FINGER_COLORS[activeTargetKey.finger].glow}`,display:"flex",alignItems:"center",gap:"12px" }}>
                  <div style={{ width:"50px",height:"50px",borderRadius:"12px",flexShrink:0,background:`${FINGER_COLORS[activeTargetKey.finger].hex}18`,border:`2px solid ${FINGER_COLORS[activeTargetKey.finger].hex}55`,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'JetBrains Mono',monospace",fontSize:"22px",fontWeight:800,color:FINGER_COLORS[activeTargetKey.finger].hex,textShadow:`0 0 14px ${FINGER_COLORS[activeTargetKey.finger].hex}` }}>
                    {targetChar === " " ? "⎵" : targetChar}
                  </div>
                  <div>
                    <div style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"8px",letterSpacing:"0.1em",color:"#475569",textTransform:"uppercase",marginBottom:"3px" }}>Next Key</div>
                    <div style={{ fontFamily:"'Rajdhani',sans-serif",fontWeight:700,fontSize:"12px",color:FINGER_COLORS[activeTargetKey.finger].hex }}>
                      {activeTargetKey.hand.toUpperCase()} · {FINGER_COLORS[activeTargetKey.finger].label.toUpperCase()}
                    </div>
                    {targetLayer && targetLayer !== "unshifted" && (
                      <div style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"8px",fontWeight:700,letterSpacing:"0.08em",color:"#ffd700",marginTop:"3px" }}>
                        HOLD {targetLayer === "altGrShift" ? "ALTGR + SHIFT" : targetLayer.toUpperCase()}
                      </div>
                    )}
                  </div>
                </div>
              )}

              <FingerHUD activeTargetKey={testState === "running" ? activeTargetKey : null} />
            </div>

            {/* RIGHT CONTENT */}
            <div className="content-col">

              {/* Prompt Card & Start Test Flow */}
              <div className="glass-cyan scanlines" style={{ borderRadius:"16px",padding:"20px",position:"relative",borderColor:`${currentTheme.accentHex}33` }}>
                <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"12px" }}>
                  <div style={{ display:"flex",alignItems:"center",gap:"8px" }}>
                    <span style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"9px",fontWeight:700,letterSpacing:"0.14em",color:`${currentTheme.accentHex}bb`,textTransform:"uppercase" }}>▶ TYPING PROMPT</span>
                    <span style={{ fontSize:"8px",padding:"2px 8px",borderRadius:"6px",background:"rgba(255,215,0,0.15)",border:"1px solid rgba(255,215,0,0.3)",color:"#ffd700",fontFamily:"'Orbitron',sans-serif",fontWeight:700 }}>
                      {activeLevel.name.split(":")[0]}
                    </span>
                  </div>
                  <div style={{ display:"flex",alignItems:"center",gap:"6px" }}>
                    <span style={{ fontSize:"14px" }}>{activeLang.flag}</span>
                    <span style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"8px",color:sc,letterSpacing:"0.08em" }}>{activeLang.name.toUpperCase()} · {activeLang.script.toUpperCase()}</span>
                    {activeLang.rtl && <span className="rtl-badge">RTL</span>}
                  </div>
                </div>

                {/* PROMPT TEXT */}
                <div
                  style={{ fontFamily:"'JetBrains Mono','Noto Sans','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Malayalam','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Sans Sinhala','Noto Sans Arabic','Noto Sans Hebrew','Noto Sans Greek','Noto Sans Thai','Noto Sans Georgian','Noto Sans Armenian','Noto Sans Ethiopic','Noto Sans Myanmar','Noto Sans Cherokee','Noto Sans Meetei Mayek','Noto Sans Tibetan','Noto Sans Ol Chiki','Noto Sans Thaana','Noto Sans Khmer','Noto Sans Lao',sans-serif", fontSize:"clamp(15px,1.8vw,21px)", lineHeight:"1.9", letterSpacing:"0.04em", display:"flex", flexWrap:"wrap", gap:"1px", minHeight:"60px", opacity: testState === "idle" ? 0.45 : 1, transition:"opacity 0.3s ease", direction: activeLang.rtl ? "rtl" : "ltr" }}
                >
                  {[...promptText].map((ch, i) => {
                    const isTyped   = i < typedInput.length;
                    const isCurrent = testState === "running" && i === typedInput.length;
                    const isCorrect = isTyped && typedInput[i] === ch;
                    let cls = "prompt-pending";
                    if (isCorrect)   cls = "prompt-correct";
                    else if (isTyped)  cls = "prompt-error";
                    else if (isCurrent) cls = "prompt-current";
                    return <span key={i} className={cls} style={{ padding:"1px 2px",borderRadius:"3px",fontFamily:"'JetBrains Mono','Noto Sans','Noto Sans Devanagari','Noto Sans Bengali','Noto Sans Tamil','Noto Sans Malayalam','Noto Sans Telugu','Noto Sans Kannada','Noto Sans Gujarati','Noto Sans Gurmukhi','Noto Sans Oriya','Noto Sans Sinhala','Noto Sans Arabic','Noto Sans Hebrew','Noto Sans Greek','Noto Sans Thai','Noto Sans Georgian','Noto Sans Armenian','Noto Sans Ethiopic','Noto Sans Myanmar','Noto Sans Cherokee','Noto Sans Meetei Mayek','Noto Sans Tibetan','Noto Sans Ol Chiki','Noto Sans Thaana','Noto Sans Khmer','Noto Sans Lao',sans-serif" }}>{ch === " " ? "\u00A0" : ch}</span>;
                  })}
                </div>

                {/* START TEST BUTTON FLOW */}
                {testState === "idle" && (
                  <div style={{ marginTop:"16px",paddingTop:"14px",borderTop:"1px solid rgba(255,255,255,0.08)",display:"flex",flexDirection:"column",alignItems:"center",gap:"10px" }}>
                    <button className="btn-start-test" onClick={handleStartTest}>
                      🚀 START TEST
                    </button>
                    <p style={{ fontFamily:"'Orbitron',sans-serif",fontSize:"9px",color:"#94a3b8",letterSpacing:"0.1em" }}>
                      CLICK <span style={{ color:"#00f5ff" }}>'START TEST'</span> OR PRESS <span style={{ color:"#00f5ff" }}>ENTER / SPACE</span> TO BEGIN
                    </p>
                  </div>
                )}
              </div>

              {/* 3D Keyboard Canvas */}
              <div className="glass scanlines" style={{ borderRadius:"18px",overflow:"hidden",height:"clamp(340px,40vh,480px)",position:"relative",boxShadow:`0 0 40px ${currentTheme.accentHex}15, 0 0 80px rgba(155,48,255,0.05)`,borderColor:`${currentTheme.accentHex}33` }}>
                <Keyboard3DCanvas
                  pressedKeysRef={pressedKeysRef}
                  activeTargetKeyRef={activeTargetRef}
                  cameraPreset={cameraPreset}
                  langCode={`${activeLang.code}-${activeLang.name}`}
                  keyboardMap={keyboardMap}
                  theme={currentTheme}
                  activeModifier={activeModifier}
                />
                <div style={{ position:"absolute",top:"10px",left:"12px",fontFamily:"'Orbitron',sans-serif",fontSize:"8px",color:`${currentTheme.accentHex}66`,letterSpacing:"0.12em",pointerEvents:"none" }}>3D MECHANICAL · LIVE</div>
                <div style={{ position:"absolute",top:"10px",right:"12px",fontFamily:"'Orbitron',sans-serif",fontSize:"8px",color:`${sc}66`,letterSpacing:"0.1em",pointerEvents:"none" }}>
                  {activeLang.script.toUpperCase()} · LAYER: {activeModifier.toUpperCase()}
                </div>
                {activeLang.rtl && (
                  <div style={{ position:"absolute",bottom:"10px",left:"12px",fontFamily:"'Orbitron',sans-serif",fontSize:"7px",color:"#fb923c66",letterSpacing:"0.1em",pointerEvents:"none" }}>RTL SCRIPT</div>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
